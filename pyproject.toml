[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ted-watch"
version = "0.1.0"
description = "EU tender deadline-change watch on TED"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[tool.uv]
dev-dependencies = [
    "hypothesis>=6.0",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.hatch.build.targets.wheel]
packages = ["src/ted_watch", "src/tenders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
