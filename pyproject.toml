[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ted-watch"
version = "0.1.0"
description = "EU tender deadline-change watch on TED"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "hypothesis>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.hatch.build.targets.wheel]
packages = ["src/ted_watch", "src/tenders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
warn_unused_configs = true
# tests/ and the tenders shim import src.ted_watch, the same files as ted_watch.
exclude = ["(^|/)tests/", "(^|/)src/tenders/"]

# Strict-ish checking for core/, connectors/ and conformance/ only.
[[tool.mypy.overrides]]
module = [
    "ted_watch.core",
    "ted_watch.core.*",
    "ted_watch.connectors",
    "ted_watch.connectors.*",
    "ted_watch.conformance",
]
strict = true
disallow_untyped_defs = true
